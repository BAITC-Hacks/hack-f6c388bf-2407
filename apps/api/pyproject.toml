[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akim-five-hours-api"
version = "0.1.0"
description = "API for the Akim na 5 chasov city simulator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0"
]

[project.optional-dependencies]
ai = ["openai>=2.0,<3.0"]
test = ["jsonschema>=4.23,<5.0", "PyYAML>=6.0,<7.0", "httpx>=0.28,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/akim_api"]

[tool.ruff]
line-length = 100
target-version = "py311"
